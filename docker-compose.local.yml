version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: itmizer_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: itmizer_vr
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - itmizer_local_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d itmizer_vr"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  itmizer_local_pgdata:
    name: itmizer_local_pgdata
