version: '3.8'

services:
  # ==========================================
  # Backend NestJS + Prisma (Conecta ao Banco Externo)
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: itmizer_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL:-${DATABASE_URL}}
      JWT_SECRET: ${JWT_SECRET:-itmizer_jwt_super_secret_key_2026}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-m0yU7X/W2t3qL8zF1+n6jK9xV4cR7tE1aP8oD3iU5vA=}
      PORT: 3000
    volumes:
      - ./backups:/app/backups
    networks:
      - itmizer_network

  # ==========================================
  # Frontend React (Vite + Nginx na Porta 3009)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: itmizer_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3009:80"
    networks:
      - itmizer_network

  # ==========================================
  # Cloudflare Tunnel
  # ==========================================
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: itmizer_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-eyJhIjoiOTY0ZjZkMjVlMGNmOTRmMTYyYzZkNjc4NGVlNTIyOGYiLCJ0IjoiOGYwYzE5NDYtNDg3ZC00NzdmLTk2NzEtZWY2NmJmNzMyNmZlIiwicyI6Ik9HVXlNamd3TkdJdE5ETTNNQzAwTXpRekxXSXpPVGd0TkdVMFltRXhPVGRqTWpJMiJ9}
    depends_on:
      - frontend
      - backend
    extra_hosts:
      - "localhost:host-gateway"
      - "host.docker.internal:host-gateway"
    networks:
      - itmizer_network

networks:
  itmizer_network:
    name: itmizer_network
    driver: bridge
